<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Account Connected — Post Automator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #f1f5f9;
      padding: 24px;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 44px 40px;
      text-align: center;
      max-width: 480px;
      width: 100%;
      backdrop-filter: blur(16px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .icon-badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 10px 25px -5px rgba(79, 172, 254, 0.4);
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; color: #fff; letter-spacing: -0.02em; }
    p.sub { font-size: 0.95rem; color: #94a3b8; line-height: 1.5; margin-bottom: 24px; }
    .btn-open {
      display: block;
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 14px;
      margin-bottom: 18px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
    }
    .btn-open:hover { transform: translateY(-1px); box-shadow: 0 14px 24px -5px rgba(37, 99, 235, 0.5); }
    .code-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px 16px;
      text-align: left;
      margin-top: 20px;
    }
    .code-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 8px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .code-val {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      word-break: break-all;
      max-height: 80px;
      overflow-y: auto;
      line-height: 1.4;
    }
    .btn-copy {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-copy:hover { background: rgba(255, 255, 255, 0.2); }
    .status-text { font-size: 0.85rem; color: #10b981; margin-top: 12px; }
    .error-box { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; padding: 12px; border-radius: 12px; font-size: 0.9rem; margin-top: 16px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-badge">✨</div>
    <h1>TikTok Authorization Complete</h1>
    <p class="sub">Click the button below to hand off to Post Automator, or copy your authorization code.</p>

    <a id="btn-open-app" href="#" class="btn-open">Open Post Automator</a>

    <div class="code-box" id="code-section">
      <div class="code-label">
        <span>Authorization Code</span>
        <button class="btn-copy" id="btn-copy" onclick="copyCode()">Copy Code</button>
      </div>
      <div class="code-val" id="code-val">Extracting code…</div>
    </div>

    <div class="error-box" id="error-box"></div>
  </div>

  <script>
    (function () {
      const searchParams = new URLSearchParams(window.location.search);
      const code = searchParams.get('code');
      const error = searchParams.get('error') || searchParams.get('error_description');
      const params = window.location.search;
      const deepLink = 'postautomator://callback' + params;

      const btnOpen = document.getElementById('btn-open-app');
      btnOpen.href = deepLink;

      const codeVal = document.getElementById('code-val');
      const errorBox = document.getElementById('error-box');

      if (error) {
        errorBox.style.display = 'block';
        errorBox.textContent = 'TikTok error: ' + error;
        document.getElementById('code-section').style.display = 'none';
        btnOpen.style.display = 'none';
        return;
      }

      if (code) {
        codeVal.textContent = code;
      } else {
        codeVal.textContent = 'No code received in URL.';
      }

      // Automatically attempt to trigger deep link
      window.location.href = deepLink;

      // Also try notifying local dev server
      if (params) {
        try {
          fetch('http://localhost:1420/_dev_api/oauth_callback' + params, { mode: 'no-cors' }).catch(function () {});
        } catch (e) {}
      }
    })();

    function copyCode() {
      const searchParams = new URLSearchParams(window.location.search);
      const code = searchParams.get('code') || window.location.href;
      navigator.clipboard.writeText(code).then(function() {
        const btn = document.getElementById('btn-copy');
        btn.textContent = 'Copied!';
        btn.style.background = '#10b981';
        btn.style.color = '#fff';
        setTimeout(function() {
          btn.textContent = 'Copy Code';
          btn.style.background = '';
          btn.style.color = '';
        }, 2000);
      });
    }
  </script>
</body>
</html>
